<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honorable UI previews</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><b>HONORABLE</b><h1>Private intelligence,<br>beautifully simple.</h1><p>Static browser previews aligned with the native circular-inspired design.</p></div><button id="theme" aria-label="Toggle theme">◐</button></header>
<nav id="tabs"></nav><main id="screens"></main>
<template id="phone"><section class="phone"><div class="status"><span>9:41</span><span>● ◔ ▰</span></div><div class="content"></div><div class="homebar"></div></section></template>
<script>
const data=[
['Home',`<span class="eyebrow">GOOD MORNING</span><h2>What can I help<br>you uncover?</h2><article><i>⌁</i><div><h3>Memories AI</h3><p>Find any photo or video with natural language.</p></div><b>›</b></article><article><i>§</i><div><h3>Terms AI</h3><p>See what matters before you agree.</p></div><b>›</b></article><small>♢ Private by design · On-device</small>`],
['Memories',`<div class="top">‹ <b>Memories</b> ⋯</div><h2>Describe a moment</h2><div class="search">⌕ &nbsp; red car in snow <button>↑</button></div><p class="hint">Try “people laughing at the beach”</p><div class="progress"><i>◌</i><div><b>Library ready</b><p>12,482 items indexed locally</p></div></div><h3>Recent searches</h3><ul><li>birthday cake <span>›</span></li><li>flight screenshot <span>›</span></li><li>tennis outside <span>›</span></li></ul>`],
['Results',`<div class="top">‹ <b>12 results</b> ◫</div><div class="search compact">⌕ red car in snow</div><div class="chips"><em>All</em><span>Photos</span><span>Videos</span></div><div class="grid">${['car','snow','road','mountain','winter','drive'].map((x,i)=>`<figure class="p${i}"><figcaption>${i===0?'92% · Visual match':''}</figcaption></figure>`).join('')}</div><p class="privacy">Results ranked entirely on this device</p>`],
['Terms AI',`<div class="top">‹ <b>Terms AI</b> ◷</div><h2>Know before<br>you agree.</h2><p>Paste terms, a privacy policy, or subscription agreement.</p><div class="document">⌘<b>Paste text or URL</b><span>Your content stays on this device.</span></div><button class="primary">Analyze terms</button><small>Informational only · Not legal advice</small>`],
['Analysis',`<div class="top">‹ <b>Analysis</b> ⋯</div><div class="risk"><i>!</i><div><span>OVERALL RISK</span><h2>Medium</h2></div></div><div class="summary"><h3>Quick summary</h3><p>Renews annually unless cancelled 24 hours before renewal. Some usage data may be shared.</p></div><details open><summary>Watch out <b>3</b></summary><p>Automatic renewal · Binding arbitration · Limited refunds</p></details><details><summary>Good <b>2</b></summary></details><details><summary>Privacy & data <b>4</b></summary></details><small>Informational only · Not legal advice</small>`],
['Subscription',`<span class="eyebrow">HONORABLE PLUS</span><h2>More understanding.<br>Still private.</h2><div class="orb">✦</div><ul class="checks"><li>✓ Unlimited Memories searches</li><li>✓ Deeper Terms analysis</li><li>✓ Video moment search</li></ul><div class="plans"><label><input type="radio" name="p"> Monthly <b>$5.99</b></label><label class="selected"><input checked type="radio" name="p"> Annual <b>$39.99</b><em>Save 44%</em></label></div><button class="primary">Continue</button><small>Restore purchases · Store setup required</small>`],
['Settings',`<div class="top">‹ <b>Settings</b> </div><div class="profile"><i>A</i><div><b>Account</b><p>Google Sign-In not configured</p></div><span>›</span></div><h4>PRIVACY</h4><ul><li>Indexing <span>Ready ›</span></li><li>Local data <span>12,482 items ›</span></li><li>Privacy <span>›</span></li></ul><h4>APPEARANCE</h4><ul><li>Theme <span>System ›</span></li></ul><h4>PLAN</h4><ul><li>Honorable Free <span>Upgrade ›</span></li><li>Restore purchases <span>›</span></li></ul>`]
];
const tabs=document.querySelector('#tabs'), screens=document.querySelector('#screens'); data.forEach(([name,html],i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>show(i);tabs.append(b);let p=document.querySelector('#phone').content.cloneNode(true);p.querySelector('.phone').dataset.name=name;p.querySelector('.content').innerHTML=html;screens.append(p)});function show(n){[...screens.children].forEach((x,i)=>x.classList.toggle('active',i===n));[...tabs.children].forEach((x,i)=>x.classList.toggle('active',i===n))}show(0);document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></body></html>
