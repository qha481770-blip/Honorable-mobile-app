name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        run: ./gradlew --no-daemon test
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build unsigned release AAB
        run: ./gradlew --no-daemon bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honorable-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: honorable-unsigned-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
