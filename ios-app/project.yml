name: Honorable
options:
  bundleIdPrefix: app.honorable
targets:
  Honorable:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Honorable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.honorable.ios
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Honorable indexes your library privately on this device.
        INFOPLIST_KEY_CFBundleDisplayName: Honorable
  HonorableTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [HonorableTests]
    dependencies: [{target: Honorable}]
